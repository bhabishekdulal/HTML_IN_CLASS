<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>
    <link href="./selfnavcard.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <div id="navbar">
        <div class="logo">
            <div class="logo-image">
                <img src="" alt="Jhon Doe">
            </div>
            <div class="logo-text">Jhon Doe</div>
        </div>
        
        <div class="menus">
            <div class="home">Home</div>
            <div class="about">About</div>
            <div class="skills">Skills</div>
            <div class="portfolio">Portfolio</div>
            <div class="contact">Contact</div>
        </div>
        
        <div class="socialicons">
            <div class="linkedin">
                <i class="fa fa-linkedin-square"></i>
            </div>
            <div class="facebook">
                <i class="fa fa-facebook"></i>
            </div>
            <div class="instagram">
                <i class="fa fa-instagram"></i>
            </div>
        </div>
    </div>

    <div id="container">
        <div class="hero-text">
            <div class="rrblack">RESPONSIVE</div>
            <div class="nblue">NAVIGATION</div>
            <div class="rrblack">BAR</div>
        </div>

        <div class="box">
            <img src="https://www.voice7news.tv/uploads/messi-letter-6a9662761e8f7-20260901155510.jpg" alt="Mobile Navigation Screenshot">
        </div>
    </div>

</body>
</html>
