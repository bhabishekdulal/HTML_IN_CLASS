<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Marksheet — Task 01</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <p class="eyebrow">HTML TABLE PRACTICE / TASK 01</p>
    <h1>Student marksheet</h1>


    <table class="marksheet-table">
      <caption>Student marksheet</caption>

      <colgroup>
        <col class="col-details" span="2" />
        <col class="col-marks" span="3" />
        <col class="col-total" />
      </colgroup>

      <thead>
        <tr>
          <th colspan="2" scope="colgroup">Student details</th>
          <th colspan="3" scope="colgroup">Subject marks (out of 100)</th>
          <th rowspan="2" scope="col">
            Total
            <span class="sub-label">out of 300</span>
          </th>
        </tr>
        <tr>
          <th scope="col">Roll no.</th>
          <th scope="col">Name</th>
          <th scope="col">HTML</th>
          <th scope="col">CSS</th>
          <th scope="col">JavaScript</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td class="num">1</td>
          <td class="name">Asha</td>
          <td class="num">88</td>
          <td class="num">84</td>
          <td class="num">90</td>
          <td class="num">262</td>
        </tr>
        <tr>
          <td class="num">2</td>
          <td class="name">Bikash</td>
          <td class="num">75</td>
          <td class="num">80</td>
          <td class="num">78</td>
          <td class="num">233</td>
        </tr>
        <tr>
          <td class="num">3</td>
          <td class="name">Nisha</td>
          <td class="num">92</td>
          <td class="num">89</td>
          <td class="num">94</td>
          <td class="num">275</td>
        </tr>
        <tr>
          <td class="num">4</td>
          <td class="name">Suman</td>
          <td class="num">68</td>
          <td class="num">72</td>
          <td class="num">70</td>
          <td class="num">210</td>
        </tr>
      </tbody>

 

  </main>
</body>
</html>
